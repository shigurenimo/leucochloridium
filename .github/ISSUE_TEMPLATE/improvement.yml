name: Improvement
description: Report a bug or propose a focused improvement.
labels: ["improvement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or improvement
      description: Describe the trigger, expected behavior and actual result, or the design issue.
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Source location
      description: Source references, if known.
      placeholder: lib/runtime/runtime.ts:344
  - type: textarea
    id: fix
    attributes:
      label: Proposed fix
      description: Suggested change, if known.
  - type: textarea
    id: diagnostics
    attributes:
      label: Runtime diagnostics
      description: Version, requestId and relevant output for runtime problems. Omit tokens and private conversation content.
      placeholder: |
        leuco --version
        leuco doctor --json
        leuco events --request <requestId> --limit 30 --json
